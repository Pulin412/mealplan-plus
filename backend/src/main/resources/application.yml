spring:
  application:
    name: mealplan-api
  datasource:
    # Local default is H2 (prod overrides DB_URL with Neon Postgres). The INIT clause teaches
    # H2 the Postgres-only enum types (tag_entity_type, and the user enums) so ddl-auto can
    # create those tables locally; on prod the real Postgres enums are used.
    url: ${DB_URL:jdbc:h2:mem:mealplandb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS tag_entity_type AS varchar(32)\;CREATE DOMAIN IF NOT EXISTS activity_level_enum AS varchar(32)\;CREATE DOMAIN IF NOT EXISTS gender_enum AS varchar(16)\;CREATE DOMAIN IF NOT EXISTS goal_type_enum AS varchar(24)\;CREATE DOMAIN IF NOT EXISTS units_enum AS varchar(16)\;CREATE DOMAIN IF NOT EXISTS citext AS varchar(64)}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    show-sql: false
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
  jackson:
    serialization:
      # ISO-8601 strings on the wire — matches the `date-time` / `date` types declared in docs/openapi.yaml.
      write-dates-as-timestamps: false
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:claude-haiku-4-5-20251001}
          max-tokens: 1024
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:7b}

agent:
  # Ordered provider failover chain. The assistant tries providers top-to-bottom; on a rate-limit /
  # quota / transient error it falls over to the next. `type: openai` uses the OpenAI-compatible wire
  # format (works for Groq / Gemini / Mistral / OpenRouter); `type: anthropic` uses the dedicated client.
  # A provider with a blank api-key (or, for anthropic, no ANTHROPIC_API_KEY) is skipped automatically.
  providers:
    - name: groq
      type: openai
      base-url: https://api.groq.com/openai
      model: ${GROQ_MODEL:openai/gpt-oss-120b}
      api-key: ${GROQ_API_KEY:}
      enabled: true
    - name: gemini
      type: openai
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      completions-path: /chat/completions
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      api-key: ${GEMINI_API_KEY:}
      enabled: true
    - name: mistral
      type: openai
      base-url: https://api.mistral.ai
      model: ${MISTRAL_MODEL:mistral-large-latest}
      api-key: ${MISTRAL_API_KEY:}
      enabled: true
    - name: anthropic
      type: anthropic
      model: ${AI_MODEL:claude-haiku-4-5-20251001}
      enabled: true

server:
  port: ${PORT:8080}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:mealplan-plus}

# App-specific config. Dev defaults here; the `prod` profile tightens them.
app:
  cors:
    # Comma-separated allowed origins. Dev: localhost + Vercel previews. Prod overrides to the prod origin.
    allowed-origins: "http://localhost:*,https://*.vercel.app,https://mealplan-plus.vercel.app"
  swagger:
    # Basic-auth credentials for Swagger/OpenAPI — only enforced by the `prod` profile.
    user: ${SWAGGER_USER:dev}
    password: ${SWAGGER_PASSWORD:dev}

# Web Push (VAPID) for PWA reminders. Keys/token are secrets — set via env in Cloud Run; blank
# locally disables sending (subscriptions are still stored). Generate a VAPID keypair with:
#   npx web-push generate-vapid-keys
push:
  vapid:
    public-key:  ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject:     ${VAPID_SUBJECT:mailto:reminders@mealplan.plus}
  # Shared secret the scheduler sends as X-Reminder-Token to POST /api/v1/internal/reminders/run.
  reminder-token: ${REMINDER_TOKEN:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.mealplanplus: DEBUG
    org.springframework.security: INFO

# Backend error tracking. Disabled unless SENTRY_DSN is set (blank locally + in tests → no-op).
# traces-sample-rate 0 = errors only, no performance sampling (keeps it firmly in the free tier);
# send-default-pii false = never attach request headers / user IP / cookies.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false
  traces-sample-rate: 0.0
