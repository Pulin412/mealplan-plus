spring:
  application:
    name: mealplan-api
  datasource:
    # Local default is H2 (prod overrides DB_URL with Neon Postgres). The INIT clause teaches
    # H2 the Postgres-only enum types (tag_entity_type, and the user enums) so ddl-auto can
    # create those tables locally; on prod the real Postgres enums are used.
    url: ${DB_URL:jdbc:h2:mem:mealplandb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS tag_entity_type AS varchar(32)\;CREATE DOMAIN IF NOT EXISTS activity_level_enum AS varchar(32)\;CREATE DOMAIN IF NOT EXISTS gender_enum AS varchar(16)\;CREATE DOMAIN IF NOT EXISTS goal_type_enum AS varchar(24)\;CREATE DOMAIN IF NOT EXISTS units_enum AS varchar(16)}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    show-sql: false
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
  jackson:
    serialization:
      # ISO-8601 strings on the wire — matches the `date-time` / `date` types declared in docs/openapi.yaml.
      write-dates-as-timestamps: false
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:claude-haiku-4-5-20251001}
          max-tokens: 1024
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:7b}

agent:
  provider: ${AGENT_PROVIDER:ollama}

server:
  port: ${PORT:8080}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:mealplan-plus}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.mealplanplus: DEBUG
    org.springframework.security: INFO
