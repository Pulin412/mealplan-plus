spring:
  application:
    name: mealplan-api
  datasource:
    # Local default is H2 (prod overrides DB_URL with Neon Postgres). The INIT clause teaches
    # H2 the Postgres-only enum types (tag_entity_type, and the user enums) so ddl-auto can
    # create those tables locally; on prod the real Postgres enums are used.
    url: ${DB_URL:jdbc:h2:mem:mealplandb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS tag_entity_type AS varchar(32)\;CREATE DOMAIN IF NOT EXISTS activity_level_enum AS varchar(32)\;CREATE DOMAIN IF NOT EXISTS gender_enum AS varchar(16)\;CREATE DOMAIN IF NOT EXISTS goal_type_enum AS varchar(24)\;CREATE DOMAIN IF NOT EXISTS units_enum AS varchar(16)\;CREATE DOMAIN IF NOT EXISTS citext AS varchar(64)}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    show-sql: false
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
  jackson:
    serialization:
      # ISO-8601 strings on the wire — matches the `date-time` / `date` types declared in docs/openapi.yaml.
      write-dates-as-timestamps: false
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: ${AI_MODEL:claude-haiku-4-5-20251001}
          max-tokens: 1024
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:7b}
    # MCP server (SSE over Spring MVC) — exposes our tools to a user's own Claude. Endpoints live under
    # /mcp/** so they can be permitted + auth-filtered as a unit. Runtime-gated by the mcp_server flag.
    mcp:
      server:
        name: mealplan-mcp
        version: 0.1.0
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message

# MCP connector-token signing secret (HMAC). Env-only, no committed default: set MCP_TOKEN_SECRET in the
# gitignored backend/.env for local, and in Cloud Run for prod. Unset = the MCP server rejects every token.
mcp:
  token-secret: "${MCP_TOKEN_SECRET:}"

# Stytch Connected-Apps OAuth (Phase 2): the MCP server validates access tokens issued by our Stytch
# project so a user's own Claude can connect via the standard OAuth add-connector flow. All non-secret
# (the project id / domain are public); env-driven so test vs live use different Stytch projects. Unset
# jwk-set-uri/audience = OAuth is off and only the HMAC connector token is accepted.
stytch:
  jwk-set-uri: "${STYTCH_JWKS_URI:}"      # e.g. https://<project-domain>/.well-known/jwks.json
  issuer: "${STYTCH_ISSUER:}"             # the `iss` on issued tokens (confirm from OIDC discovery once the authorize URL is set)
  audience: "${STYTCH_PROJECT_ID:}"       # access-token `aud` == Stytch project id
  write-scope: "${STYTCH_WRITE_SCOPE:mcp:write}"  # scope string that grants MCP writes; anything valid gets read
  uid-claim: "${STYTCH_UID_CLAIM:sub}"    # claim carrying the app (Firebase) uid; Trusted Auth Token Profile maps it (Phase 2b)

agent:
  provider: ${AGENT_PROVIDER:ollama}

server:
  port: ${PORT:8080}
  # Behind Cloud Run's TLS-terminating proxy the app sees plain HTTP, so request-derived absolute URLs
  # (OAuth Protected Resource Metadata `resource`, the WWW-Authenticate `resource_metadata` challenge)
  # would come out as http://. Honor X-Forwarded-Proto/Host so they're https:// — required for MCP/Claude
  # discovery. No-op locally (no forwarded headers).
  forward-headers-strategy: framework

firebase:
  project-id: ${FIREBASE_PROJECT_ID:mealplan-plus}

# App-specific config. Dev defaults here; the `prod` profile tightens them.
app:
  cors:
    # Comma-separated allowed origins. Dev: localhost + Vercel previews. Prod overrides to the prod origin.
    allowed-origins: "http://localhost:*,https://*.vercel.app,https://mealplan-plus.vercel.app"
  swagger:
    # Basic-auth credentials for Swagger/OpenAPI — only enforced by the `prod` profile.
    user: ${SWAGGER_USER:dev}
    password: ${SWAGGER_PASSWORD:dev}
  # Comma-separated emails granted admin (feature-flag management), matched against the Firebase token email.
  # Env-only (no committed default): set ADMIN_EMAILS in the gitignored backend/.env for local, and in Cloud Run for prod.
  admin-emails: "${ADMIN_EMAILS:}"

# Web Push (VAPID) for PWA reminders. Keys/token are secrets — set via env in Cloud Run; blank
# locally disables sending (subscriptions are still stored). Generate a VAPID keypair with:
#   npx web-push generate-vapid-keys
push:
  vapid:
    public-key:  ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject:     ${VAPID_SUBJECT:mailto:reminders@mealplan.plus}
  # Shared secret the scheduler sends as X-Reminder-Token to POST /api/v1/internal/reminders/run.
  reminder-token: ${REMINDER_TOKEN:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # DB-free health group for the uptime monitor: `/actuator/health/ping` returns UP using only
      # the built-in `ping` indicator (no SELECT 1), so pinging it keeps Cloud Run warm WITHOUT waking
      # the Neon compute. The full `/actuator/health` still runs the DB check for humans.
      group:
        ping:
          include: ping

logging:
  level:
    com.mealplanplus: DEBUG
    org.springframework.security: INFO

# Backend error tracking. Disabled unless SENTRY_DSN is set (blank locally + in tests → no-op).
# traces-sample-rate 0 = errors only, no performance sampling (keeps it firmly in the free tier);
# send-default-pii false = never attach request headers / user IP / cookies.
sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false
  traces-sample-rate: 0.0
