# Profile: prod — Cloud Run + Neon Postgres. Hardened settings; distinct from dev/local/docker.
# Activated by SPRING_PROFILES_ACTIVE=prod. DB_URL/DB_USER/DB_PASSWORD + SWAGGER_* come from secrets.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Cloud Run scales to 3 instances; keep each pool small so total connections stay within Neon.
      maximum-pool-size: 5
      minimum-idle: 0        # drain to zero when idle so a warm Cloud Run instance stops holding a
                             # Neon connection open — lets Neon scale-to-zero (compute) during quiet spells
      idle-timeout: 30000    # close idle connections after 30s (down to minimum-idle=0)
      connection-timeout: 30000
      max-lifetime: 280000   # under Neon's idle cutoff so stale conns are recycled
      data-source-properties:
        # Let pgjdbc send String params as 'unknown' so Postgres implicitly casts text -> native
        # enum types (units_enum, gender_enum, etc.). Without this, inserting a user 500s. H2 (dev)
        # models these enums as varchar DOMAINs, so this only bites on real Postgres.
        stringtype: unspecified
  jpa:
    hibernate:
      ddl-auto: validate     # never mutate the prod schema; Flyway owns migrations
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true     # safety: never allow `flyway clean` to wipe prod
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  cors:
    allowed-origins: "https://mealplan-plus.vercel.app"   # locked to the prod webapp only

server:
  shutdown: graceful          # let Cloud Run drain in-flight requests on scale-down
  compression:
    enabled: true
    mime-types: application/json
  error:
    include-message: never    # don't leak internals to clients
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

logging:
  level:
    com.mealplanplus: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    root: INFO

sentry:
  environment: prod
