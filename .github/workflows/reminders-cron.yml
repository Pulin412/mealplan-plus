name: Reminders — daily push nudges

# Sends the "you haven't logged yet" Web Push reminders by POSTing to the backend's internal endpoint.
# This is the PWA's stand-in for Android's on-device AlarmManager: the web has no on-device scheduler,
# so the schedule lives here and the server sends the push. Zero GCP billing — just a scheduled curl.
#
# Setup (one-time, in repo Settings):
#   • Secret  REMINDER_TOKEN  — must equal the backend's REMINDER_TOKEN env (Cloud Run).
#   • Variable API_BASE_URL   — optional; defaults to the prod Cloud Run URL below.
#
# Timing is best-effort — GitHub's scheduler can lag several minutes. Adjust the cron as you like.
on:
  schedule:
    - cron: "0 19 * * *"   # 19:00 UTC daily (≈ 21:00 CEST). Nudges users who haven't logged today.
  workflow_dispatch: {}     # manual "Run workflow" button for testing

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder run
        env:
          REMINDER_TOKEN: ${{ secrets.REMINDER_TOKEN }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          base="${API_BASE_URL:-https://mealplan-api-rfo22lhanq-ez.a.run.app}"
          code=$(curl -sS -o /tmp/reminders.json -w "%{http_code}" -X POST \
            "$base/api/v1/internal/reminders/run" \
            -H "X-Reminder-Token: $REMINDER_TOKEN")
          echo "HTTP $code"
          cat /tmp/reminders.json 2>/dev/null || true
          echo
          test "$code" = "200"
