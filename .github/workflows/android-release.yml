name: Android Release (manual)

# Build a versioned, installable APK on demand and publish it to a GitHub Release.
#
# Builds a RELEASE-signed (appId com.mealplanplus), NON-minified APK pointed at the PROD backend.
# Release-signed with a STABLE keystore (from the ANDROID_KEYSTORE_* secrets) whose SHA-1/SHA-256 are
# registered in Firebase — that's what makes Google sign-in work. Installs on any device via sideload
# / `adb install`. Minify stays off until proguard-rules.pro has real keep rules (see build.gradle.kts).
#
# Required repo secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD.
#
# WHEN Play creds exist: switch to a signed `:android:bundleRelease` (AAB) and enable the "Upload to
# Play" placeholder below; add PLAY_SERVICE_ACCOUNT_JSON.

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version name (e.g. 2.2.0) — cosmetic; set it each release"
        required: true
      versionCode:
        description: "Version code (integer, must increase). Leave BLANK to auto-use the run number (always the next value)."
        required: false
        default: ""
      notes:
        description: "Release notes (optional)"
        required: false
        default: ""

permissions:
  contents: write   # create the GitHub Release + upload the APK

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK (prod backend)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          ./gradlew :android:assembleRelease
          -PversionName=${{ github.event.inputs.versionName }}
          -PversionCode=${{ github.event.inputs.versionCode || github.run_number }}
          -PsingleAbi=arm64-v8a
          --no-daemon --build-cache

      - name: Rename APK with version
        id: rename
        run: |
          SRC=$(find android/build/outputs/apk/release -name "*.apk" | head -1)
          OUT="mealplanplus-${{ github.event.inputs.versionName }}.apk"
          cp "$SRC" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      # Downloadable from the workflow run (kept 90 days).
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mealplanplus-${{ github.event.inputs.versionName }}
          path: ${{ steps.rename.outputs.apk }}

      # Permanent, versioned home for the APK.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.event.inputs.versionName }}
          name: Android v${{ github.event.inputs.versionName }}
          body: |
            Installable release-signed APK (prod backend). Sideload / `adb install`.
            appId `com.mealplanplus` · versionCode ${{ github.event.inputs.versionCode || github.run_number }}

            ${{ github.event.inputs.notes }}
          files: ${{ steps.rename.outputs.apk }}
          draft: false
          prerelease: true

      # ─────────────────────────────────────────────────────────────────────────
      # PLACEHOLDER — enable once a Play Store account + upload keystore exist.
      # Replace assembleDebug above with a signed `:android:bundleRelease` (needs R8
      # keep-rules) and uncomment:
      #
      # - name: Upload to Google Play (internal track)
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      #     packageName: com.mealplanplus            # final Play applicationId
      #     releaseFiles: android/build/outputs/bundle/release/*.aab
      #     track: internal
      #     status: draft
      # ─────────────────────────────────────────────────────────────────────────
