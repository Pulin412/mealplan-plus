        '201':
          description: New workout session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutSessionDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

