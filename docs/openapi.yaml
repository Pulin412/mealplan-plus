  /api/v1/workout-templates/{id}/start:
    post:
      tags: [Workout Templates]
      summary: Start a workout session from template
      description: |
        Creates a new `WorkoutSession` pre-populated with sets from the template
        (one `WorkoutSet` per target set, with `reps` and `weightKg` from the template).
        The returned session is in `isCompleted = false` state — call `/finish` when done.
