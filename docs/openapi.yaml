  # ── Sync ─────────────────────────────────────────────────────────────────────
  /api/v1/sync/pull:
    get:
      tags: [Sync]
      summary: Pull changes since timestamp
      description: |
        Returns all user-owned records with `updatedAt > since` across every domain.
        `loggedMealSlots` are filtered by date >= the date component of `since` (they have no `updatedAt`).
        Store `serverTime` locally and pass it as `since` on the next pull. On first sync use `1970-01-01T00:00:00Z`.
        Tombstones indicate records deleted on the server since `since`.
      operationId: syncPull
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
            example: "2026-04-15T10:30:00Z"
      responses:
        '200':
          description: Delta payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '400':
          description: Missing or malformed `since` parameter
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/sync/push:
    post:
      tags: [Sync]
      summary: Push local changes to server
      description: |
        Upserts records by `serverId` using last-write-wins on `updatedAt`.
        Any domain list may be omitted or empty. Server returns each saved record
        (with server-assigned `id` and `updatedAt`) so the client can reconcile its local IDs.
      operationId: syncPush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Accepted records echoed back with server IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/push/subscriptions:
    post:
      tags: [Push]
      summary: Register a Web Push subscription for the current user
      description: |
        Stores the browser's Web Push subscription so the server can send "you haven't logged yet"
        reminders. Idempotent — upserts on `endpoint`. Presence of a subscription = reminders on.
      operationId: subscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionRequest'
      responses:
        '201':
          description: Subscription stored
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Push]
      summary: Remove a Web Push subscription
      description: Deletes the subscription for this `endpoint` (turns reminders off for this device).
      operationId: unsubscribePush
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushUnsubscribeRequest'
      responses:
        '204':
          description: Subscription removed (or already absent)
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/internal/reminders/run:
    post:
      tags: [Internal]
      summary: Send due "you haven't logged yet" reminders (scheduler-triggered)
      description: |
        Called by a scheduled job (GitHub Actions cron), **not** by end users. Evaluates every stored
        push subscription and sends a reminder to users who have not logged any food today. Authenticated
        with a shared secret in the `X-Reminder-Token` header instead of a Firebase JWT.
      operationId: runReminders
      security: []
      parameters:
        - name: X-Reminder-Token
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reminder run completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderRunResponse'
        '401':
          description: Missing or invalid reminder token

# ─────────────────────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────────────────────
components:

  securitySchemes:
    FirebaseJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token obtained via client-side Firebase Auth sign-in

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    DatePath:
      name: date
      in: path
      required: true
      schema:
        type: string
        format: date
      description: ISO-8601 date (YYYY-MM-DD)

  responses:
    Unauthorized:
      description: Missing or invalid Firebase JWT
    Forbidden:
      description: Authenticated user does not own this resource
    NotFound:
      description: Resource not found

  schemas:

    # ── Enums ─────────────────────────────────────────────────────────────────

    TagEntityType:
      type: string
      enum: [DIET, EXERCISE, MEAL, FOOD, WORKOUT]
      description: Which entity type a tag belongs to

    FoodUnit:
      type: string
      enum: [GRAM, ML, PIECE, CUP, TBSP, TSP]
      default: GRAM

    # ── User ─────────────────────────────────────────────────────────────────

    UserResponse:
      type: object
      description: Authenticated user profile with body metrics and targets.
      properties:
        id:
          type: integer
          format: int64
        firebaseUid:
          type: string
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        heightCm:
          type: number
          format: double
          nullable: true
        weightKg:
          type: number
          format: double
          nullable: true
        age:
          type: integer
          nullable: true
        gender:
          type: string
          nullable: true
          enum: [MALE, FEMALE, OTHER]
        activityLevel:
          type: string
          nullable: true
          enum: [SEDENTARY, LIGHT, MODERATE, VERY_ACTIVE, EXTRA_ACTIVE]
        goalType:
          type: string
          nullable: true
          enum: [LOSE, MAINTAIN, GAIN]
        units:
          type: string
          nullable: true
          enum: [METRIC, IMPERIAL]
          default: METRIC
        targetCalories:
          type: integer
          nullable: true
          description: Daily calorie target (kcal)
        targetProtein:
          type: integer
          nullable: true
          description: Daily protein target (g)
        targetCarbs:
          type: integer
          nullable: true
          description: Daily carbohydrate target (g)
        targetFat:
          type: integer
          nullable: true
          description: Daily fat target (g)
        createdAt:
          type: string
          format: date-time
          readOnly: true
        consentedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When the user accepted the privacy policy (null = not yet consented).
        privacyPolicyVersion:
          type: string
          nullable: true
          readOnly: true
          description: Version of the privacy policy the user consented to.
        onboardingCompletedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: When first-run onboarding was completed/skipped (null = not yet onboarded).
      required: [id, firebaseUid]

    UserUpdateRequest:
      type: object
      description: Fields accepted on PUT /api/v1/users/me (all optional — only send what changed).
      properties:
        displayName:
          type: string
          nullable: true
        heightCm:
          type: number
          format: double
          nullable: true
        weightKg:
          type: number
          format: double
          nullable: true
        age:
          type: integer
          nullable: true
        gender:
          type: string
          nullable: true
          enum: [MALE, FEMALE, OTHER]
        activityLevel:
          type: string
          nullable: true
          enum: [SEDENTARY, LIGHT, MODERATE, VERY_ACTIVE, EXTRA_ACTIVE]
        goalType:
          type: string
          nullable: true
          enum: [LOSE, MAINTAIN, GAIN]
        units:
          type: string
          nullable: true
          enum: [METRIC, IMPERIAL]
        targetCalories:
          type: integer
          nullable: true
        targetProtein:
          type: integer
          nullable: true
        targetCarbs:
          type: integer
          nullable: true
        targetFat:
          type: integer
          nullable: true
        privacyPolicyVersion:
          type: string
          nullable: true
          description: >-
            Privacy-policy version the user is accepting. When present, the server stamps
            consentedAt = now() and stores this version.
        onboardingCompleted:
          type: boolean
          nullable: true
          description: >-
            Send true when first-run onboarding is finished/skipped; the server stamps
            onboardingCompletedAt = now().

    # ── Dashboard ─────────────────────────────────────────────────────────────

    DashboardDto:
      type: object
      description: Full Today / Home screen payload.
      properties:
        date:
          type: string
          format: date
        dietId:
          type: integer
          format: int64
          nullable: true
        dietName:
          type: string
          nullable: true
        calorieRing:
          $ref: '#/components/schemas/CalorieRingDto'
        macros:
          $ref: '#/components/schemas/MacroPanelDto'
        slots:
          type: array
          items:
            $ref: '#/components/schemas/SlotStatusDto'
          description: Planned meal slots enriched with logging state
        additionalFoods:
          type: array
          items:
            $ref: '#/components/schemas/LoggedFoodResponseDto'
          description: Foods added individually via FAB (outside the slot plan)
        streak:
          $ref: '#/components/schemas/StreakDto'
        todaySteps:
          type: number
          format: double
          nullable: true
          description: Steps from Health Connect (Android) or HealthKit (iOS)
        todayCaloriesBurned:
          type: number
          format: double
          nullable: true
        latestWeight:
          $ref: '#/components/schemas/HealthMetricDto'
          nullable: true
        dietCount:
          type: integer
          format: int64
          description: Total number of diets owned by this user
      required: [date, calorieRing, macros, slots, additionalFoods, streak, dietCount]

    CalorieRingDto:
      type: object
      properties:
        target:
          type: integer
          description: Daily calorie target (kcal)
        consumed:
          type: number
          format: double
          description: Total kcal consumed (logged slots + additional foods)
        remaining:
          type: number
          format: double
          description: target − consumed; negative means over target
        isOver:
          type: boolean
      required: [target, consumed, remaining, isOver]

    MacroPanelDto:
      type: object
      properties:
        targetProtein:
          type: integer
          nullable: true
        targetCarbs:
          type: integer
          nullable: true
        targetFat:
          type: integer
          nullable: true
        consumedProtein:
          type: number
          format: double
        consumedCarbs:
          type: number
          format: double
        consumedFat:
          type: number
          format: double
      required: [consumedProtein, consumedCarbs, consumedFat]

    SlotStatusDto:
      type: object
      description: A planned meal slot enriched with its logged state and nutrition totals.
      properties:
        slot:
          type: string
          description: Slot name (e.g. "Breakfast", "Lunch", "Dinner")
        mealId:
          type: integer
          format: int64
          nullable: true
        mealName:
          type: string
          nullable: true
        isLogged:
          type: boolean
          description: Whether the user has toggled this slot as consumed today
        kcal:
          type: number
          format: double
        protein:
          type: number
          format: double
        carbs:
          type: number
          format: double
        fat:
          type: number
          format: double
        items:
          type: array
          items:
            $ref: '#/components/schemas/TodayMealItemDto'
      required: [slot, isLogged, kcal, protein, carbs, fat, items]

    TodayMealItemDto:
      type: object
      description: A food item within a planned meal slot (per-100g macros; client computes per-serving).
      properties:
        foodId:
          type: integer
          format: int64
        foodName:
          type: string
        quantity:
          type: number
          format: double
        unit:
          $ref: '#/components/schemas/FoodUnit'
        caloriesPer100:
          type: number
          format: double
        proteinPer100:
          type: number
          format: double
        carbsPer100:
          type: number
          format: double
        fatPer100:
          type: number
          format: double
        notes:
          type: string
          nullable: true
      required: [foodId, foodName, quantity, unit, caloriesPer100, proteinPer100, carbsPer100, fatPer100]

    StreakDto:
      type: object
      properties:
        current:
          type: integer
          description: Consecutive days with ≥1 logged meal slot, up to and including today
        best:
          type: integer
          description: Longest streak in the last 90 days
        dots:
          type: array
          items:
            type: boolean
          minItems: 7
          maxItems: 7
          description: 7-day window; index 0 = 6 days ago, index 6 = today
      required: [current, best, dots]

    # ── Tags ─────────────────────────────────────────────────────────────────

    TagDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string
          nullable: true
          description: Hex or CSS color string (e.g. "#FF5733")
        entityType:
          $ref: '#/components/schemas/TagEntityType'
      required: [id, name, entityType]

    CreateTagRequest:
      type: object
      properties:
        name:
          type: string
        color:
          type: string
          nullable: true
        entityType:
          $ref: '#/components/schemas/TagEntityType'
      required: [name, entityType]

    # ── Food ─────────────────────────────────────────────────────────────────

    FoodDto:
      type: object
      description: |
        A food item. All macros are **per 100 g**. `isSystemFood = true` items are
        shared across all users. `isFavorite` for system foods is stored per-user in
        `food_user_prefs`; for user-owned foods it lives on the food record itself.
      properties:
        id:
          type: integer
          format: int64
          description: Server-assigned DB ID (omit on create)
        serverId:
          type: string
          format: uuid
          nullable: true
          description: Stable client-generated UUID — sync identity
        firebaseUid:
          type: string
          readOnly: true
          description: Owner (set by server from JWT; null for system foods)
          nullable: true
        name:
          type: string
        brand:
          type: string
          nullable: true
        barcode:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
          description: Free-form category (user-picked from suggestions or custom); null = uncategorized.
        caloriesPer100:
          type: number
          format: double
        proteinPer100:
          type: number
          format: double
        carbsPer100:
          type: number
          format: double
        fatPer100:
          type: number
          format: double
        unit:
          allOf:
            - $ref: '#/components/schemas/FoodUnit'
          description: |
            The food's natural measurement unit. Macros stay per-100g; for
            PIECE/CUP/TBSP/TSP the matching gramsPer* factor converts a quantity
            (in this unit) to grams. Defaults to GRAM.
        gramsPerPiece:
          type: number
          format: double
          nullable: true
        gramsPerCup:
          type: number
          format: double
          nullable: true
        gramsPerTbsp:
          type: number
          format: double
          nullable: true
        gramsPerTsp:
          type: number
          format: double
          nullable: true
        glycemicIndex:
          type: integer
          nullable: true
        isSystemFood:
          type: boolean
          default: false
          readOnly: true
        isFavorite:
          type: boolean
          default: false
        verified:
          type: boolean
          default: false
          description: true = from a trusted nutrition database; false = user-created or unverified
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [name, caloriesPer100, proteinPer100, carbsPer100, fatPer100]

    FoodPage:
      type: object
      description: Paginated food search result (Spring Page).
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/FoodDto'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
          description: Current page (0-indexed)
        size:
          type: integer
      required: [content, totalElements, totalPages, number, size]

    # ── Meal ─────────────────────────────────────────────────────────────────

    MealFoodItemDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        mealId:
          type: integer
          format: int64
        foodId:
          type: integer
          format: int64
        foodServerId:
          type: string
          format: uuid
          nullable: true
          description: Used during sync push to resolve the food when local IDs differ
        quantity:
          type: number
          format: double
        unit:
          $ref: '#/components/schemas/FoodUnit'
        notes:
          type: string
          nullable: true
      required: [foodId, quantity, unit]

    MealDto:
      type: object
      description: |
        A named, reusable collection of foods. Can be tagged with one or more meal
        slots (Breakfast, Evening, …) for filtering; diets reference a meal by id.
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: string
          format: uuid
          nullable: true
        firebaseUid:
          type: string
          readOnly: true
        name:
          type: string
        slots:
          type: array
          description: Meal slots this meal is tagged with (e.g. "Breakfast", "Post-workout").
          items:
            type: string
          default: []
        items:
          type: array
          items:
            $ref: '#/components/schemas/MealFoodItemDto'
          default: []
        isFavorite:
          type: boolean
          default: false
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [name]

    # ── Diet ─────────────────────────────────────────────────────────────────

    DietMealDto:
      type: object
      description: Maps a meal to a slot within a diet (by day-of-week and slot name).
      properties:
        id:
          type: integer
          format: int64
        dietId:
          type: integer
          format: int64
        mealId:
          type: integer
          format: int64
        mealServerId:
          type: string
          format: uuid
          nullable: true
          description: Stable UUID of the referenced meal, so offline clients can resolve it.
        dayOfWeek:
          type: integer
          minimum: 0
          maximum: 7
          description: 1 = Monday … 7 = Sunday; 0 = applies to any day
        slot:
          type: string
          description: Meal slot name (e.g. "Breakfast", "Lunch", "Dinner", "Pre-workout")
        instructions:
          type: string
          nullable: true
      required: [mealId, dayOfWeek, slot]

    DietFoodItemDto:
      type: object
      description: A food item added directly to a diet slot (without going through a Meal).
      properties:
        id:
          type: integer
          format: int64
        dietId:
          type: integer
          format: int64
        foodId:
          type: integer
          format: int64
        foodServerId:
          type: string
          format: uuid
          nullable: true
          description: Stable UUID of the referenced food, so offline clients can resolve it.
        slot:
          type: string
          description: Meal slot name
        quantity:
          type: number
          format: double
          default: 1.0
        unit:
          $ref: '#/components/schemas/FoodUnit'
      required: [foodId, slot, quantity, unit]

    DietDto:
      type: object
      description: A day-plan template composed of meals and direct food entries, with optional macro targets.
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: string
          format: uuid
          nullable: true
        firebaseUid:
          type: string
          readOnly: true
        name:
          type: string
        description:
          type: string
          nullable: true
        targetCalories:
          type: number
          format: double
          nullable: true
        targetProtein:
          type: number
          format: double
          nullable: true
        targetCarbs:
          type: number
          format: double
          nullable: true
        targetFat:
          type: number
          format: double
          nullable: true
        meals:
          type: array
          items:
            $ref: '#/components/schemas/DietMealDto'
          default: []
        foodItems:
          type: array
          items:
            $ref: '#/components/schemas/DietFoodItemDto'
          default: []
          description: Foods added directly to a slot (not via a Meal)
        tagIds:
          type: array
          items:
            type: integer
            format: int64
          default: []
          description: IDs of tags assigned to this diet
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDto'
          default: []
          readOnly: true
          description: Full tag objects (read-only; send tagIds to assign)
        isFavorite:
          type: boolean
          default: false
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [name]

    # ── Exercises ─────────────────────────────────────────────────────────────

    ExerciseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
          description: Optional free-text notes / how-to for the exercise.
        isSystem:
          type: boolean
          default: false
          readOnly: true
          description: true = bundled system exercise visible to all users
        tagIds:
          type: array
          items:
            type: integer
            format: int64
          default: []
          description: IDs of EXERCISE-type tags assigned to this exercise
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDto'
          default: []
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [name]

    # ── Workout Templates ─────────────────────────────────────────────────────

    TemplateExerciseDto:
      type: object
      description: An exercise within a workout template with its ordered per-set targets.
      properties:
        id:
          type: integer
          format: int64
        templateId:
          type: integer
          format: int64
        exerciseId:
          type: integer
          format: int64
        orderIndex:
          type: integer
          default: 0
        sets:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSetDto'
          default: []
          description: Ordered per-set targets (reps + optional weight). Total sets = sets.length.
        notes:
          type: string
          nullable: true
        exerciseName:
          type: string
          readOnly: true
          description: Denormalized exercise name for display convenience
      required: [exerciseId]

    TemplateSetDto:
      type: object
      description: One target set within a template exercise (mirrors WorkoutSetDto for sessions).
      properties:
        setNumber:
          type: integer
          default: 0
          description: 0-indexed set order within the exercise
        reps:
          type: integer
          nullable: true
          minimum: 1
        weightKg:
          type: number
          format: double
          nullable: true
          description: Target weight in kg (canonical); clients display in the user's unit.
      required: [setNumber]

    WorkoutTemplateDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firebaseUid:
          type: string
          readOnly: true
        name:
          type: string
        notes:
          type: string
          nullable: true
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/TemplateExerciseDto'
          default: []
        tagIds:
          type: array
          items:
            type: integer
            format: int64
          default: []
          description: IDs of WORKOUT-type tags assigned to this template
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagDto'
          default: []
          readOnly: true
          description: Full tag objects (read-only; send tagIds to assign)
      required: [name]

    # ── Workout Sessions ──────────────────────────────────────────────────────

    WorkoutSetDto:
      type: object
      description: Actual reps and weight logged for one set of one exercise.
      properties:
        id:
          type: integer
          format: int64
        sessionId:
          type: integer
          format: int64
        exerciseId:
          type: integer
          format: int64
        setNumber:
          type: integer
          description: 0-indexed set order within this exercise in this session
        reps:
          type: integer
          nullable: true
        weightKg:
          type: number
          format: double
          nullable: true
        notes:
          type: string
          nullable: true
      required: [exerciseId, setNumber]

    WorkoutSessionDto:
      type: object
      description: A completed (or in-progress) workout log for one day.
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: string
          format: uuid
          nullable: true
        firebaseUid:
          type: string
          readOnly: true
        name:
          type: string
          description: Workout / activity name
        date:
          type: string
          format: date
          nullable: true
          description: The day this workout was performed (YYYY-MM-DD)
        durationMinutes:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        isCompleted:
          type: boolean
          default: false
        sets:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutSetDto'
          default: []
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [name]

    LastSetsDto:
      type: object
      description: Sets from the most recent completed session containing the given exercise.
      properties:
        exerciseId:
          type: integer
          format: int64
        sets:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutSetDto'
      required: [exerciseId, sets]

    # ── Plans ─────────────────────────────────────────────────────────────────

    PlannedWorkoutDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        workoutTemplateId:
          type: integer
          format: int64
          nullable: true
          description: If set, links to a WorkoutTemplate. If null, activityName is a free-text activity.
        activityName:
          type: string
          description: Display name (template name or custom activity)
      required: [activityName]

    DayPlanDto:
      type: object
      description: |
        A calendar entry linking a diet and planned workouts to a specific date.
        Identified by `(firebaseUid, date)` — only one plan per user per date.
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: string
          format: uuid
          nullable: true
        firebaseUid:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          description: YYYY-MM-DD
        dietId:
          type: integer
          format: int64
          nullable: true
        plannedWorkouts:
          type: array
          items:
            $ref: '#/components/schemas/PlannedWorkoutDto'
          default: []
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [date]

    # ── Logging ───────────────────────────────────────────────────────────────

    LoggedMealSlotDto:
      type: object
      description: |
        Records whether a planned meal slot was consumed on a given date.
        Unique per (firebaseUid, date, slot). Drives the calorie ring and streak.
      properties:
        id:
          type: integer
          format: int64
        date:
          type: string
          format: date
        slot:
          type: string
          description: Slot name matching a DietMealDto slot
        isLogged:
          type: boolean
      required: [date, slot, isLogged]

    AddLoggedFoodRequest:
      type: object
      description: Request body for POST /api/v1/logging/foods
      properties:
        date:
          type: string
          format: date
        foodId:
          type: integer
          format: int64
        mealSlot:
          type: string
        quantity:
          type: number
          format: double
        unit:
          $ref: '#/components/schemas/FoodUnit'
      required: [date, foodId, mealSlot, quantity]

    LoggedFoodResponseDto:
      type: object
      description: An individually-logged food entry (added via FAB, outside the slot plan).
      properties:
        id:
          type: integer
          format: int64
        dailyLogId:
          type: integer
          format: int64
        date:
          type: string
          format: date
        foodId:
          type: integer
          format: int64
        mealSlot:
          type: string
        quantity:
          type: number
          format: double
        unit:
          $ref: '#/components/schemas/FoodUnit'
      required: [id, dailyLogId, date, foodId, mealSlot, quantity, unit]

    # ── Health Metrics ────────────────────────────────────────────────────────

    HealthMetricDto:
      type: object
      description: |
        A single health measurement. Built-in types: WEIGHT (kg), GLUCOSE (mg/dL),
        BLOOD_PRESSURE (value=systolic, secondaryValue=diastolic), STEPS, CALORIES_BURNED.
        Custom types defined via /health-metrics/custom-types are also supported.
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: string
          format: uuid
          nullable: true
        firebaseUid:
          type: string
          readOnly: true
        type:
          type: string
          example: WEIGHT
          description: Metric type string (built-in or custom)
        subType:
          type: string
          nullable: true
          description: Sub-type discriminator (e.g. SYSTOLIC / DIASTOLIC for BP)
        value:
          type: number
          format: double
        secondaryValue:
          type: number
          format: double
          nullable: true
          description: Second reading — used for diastolic BP
        unit:
          type: string
          example: kg
        recordedAt:
          type: string
          format: date-time
          description: When the measurement was taken (client-provided; required)
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [type, value, unit, recordedAt]

    CustomMetricTypeDto:
      type: object
      description: User-defined metric type (e.g. "Waist circumference cm").
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: string
          format: uuid
          nullable: true
        firebaseUid:
          type: string
          readOnly: true
        name:
          type: string
        unit:
          type: string
        icon:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [name, unit]

    # ── Daily Logs (legacy) ───────────────────────────────────────────────────

    LoggedFoodDto:
      type: object
      description: A food entry within a legacy DailyLog (used by sync).
      properties:
        id:
          type: integer
          format: int64
        dailyLogId:
          type: integer
          format: int64
        foodId:
          type: integer
          format: int64
        mealSlot:
          type: string
        quantity:
          type: number
          format: double
        unit:
          $ref: '#/components/schemas/FoodUnit'
      required: [foodId, mealSlot, quantity, unit]

    DailyLogDto:
      type: object
      description: Legacy per-day food consumption log. One record per user per date. Used by sync.
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: string
          format: uuid
          nullable: true
        firebaseUid:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          example: "2026-07-18"
        notes:
          type: string
          nullable: true
        loggedFoods:
          type: array
          items:
            $ref: '#/components/schemas/LoggedFoodDto'
          default: []
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [date]

    # ── Grocery ───────────────────────────────────────────────────────────────

    GroceryItemDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        groceryListId:
          type: integer
          format: int64
        foodId:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
        quantity:
          type: number
          format: double
          default: 1.0
        unit:
          $ref: '#/components/schemas/FoodUnit'
        category:
          type: string
          nullable: true
        done:
          type: boolean
          default: false
      required: [name, quantity, unit]

    GroceryListDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        serverId:
          type: string
          format: uuid
          nullable: true
        firebaseUid:
          type: string
          readOnly: true
        name:
          type: string
        dietId:
          type: integer
          format: int64
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroceryItemDto'
          default: []
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required: [name]

    # ── Sync ─────────────────────────────────────────────────────────────────

    TombstoneDto:
      type: object
      description: |
        Indicates a server-side deletion. Clients should delete any local record
        matching `(entityType, serverId)` when they receive a tombstone on pull.
      properties:
        entityType:
          type: string
          description: Entity type string (e.g. "food", "meal", "diet", "workout_session", "day_plan")
        serverId:
          type: string
          format: uuid
        deletedAt:
          type: string
          format: date-time
      required: [entityType, serverId, deletedAt]

    SyncPushRequest:
      type: object
      description: |
        Locally-changed records since the last successful push.
        Any domain list may be omitted — only send what has changed.
        Server upserts by `serverId` using last-write-wins on `updatedAt`.
      properties:
        foods:
          type: array
          items:
            $ref: '#/components/schemas/FoodDto'
          default: []
        meals:
          type: array
          items:
            $ref: '#/components/schemas/MealDto'
          default: []
        diets:
          type: array
          items:
            $ref: '#/components/schemas/DietDto'
          default: []
        healthMetrics:
          type: array
          items:
            $ref: '#/components/schemas/HealthMetricDto'
          default: []
        groceryLists:
          type: array
          items:
            $ref: '#/components/schemas/GroceryListDto'
          default: []
        dailyLogs:
          type: array
          items:
            $ref: '#/components/schemas/DailyLogDto'
          default: []
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseDto'
          default: []
        workoutSessions:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutSessionDto'
          default: []
        dayPlans:
          type: array
          items:
            $ref: '#/components/schemas/DayPlanDto'
          default: []
        loggedMealSlots:
          type: array
          items:
            $ref: '#/components/schemas/LoggedMealSlotDto'
          default: []
        tombstones:
          type: array
          description: Local deletions to propagate — server deletes each matching `(entityType, serverId)`.
          items:
            $ref: '#/components/schemas/TombstoneDto'
          default: []

    SyncPushResponse:
      type: object
      description: |
        Server returns each saved record with its server-assigned `id` and `updatedAt`
        so clients can reconcile local IDs. `accepted` is the total count across all domains.
      properties:
        accepted:
          type: integer
        foods:
          type: array
          items:
            $ref: '#/components/schemas/FoodDto'
        meals:
          type: array
          items:
            $ref: '#/components/schemas/MealDto'
        diets:
          type: array
          items:
            $ref: '#/components/schemas/DietDto'
        healthMetrics:
          type: array
          items:
            $ref: '#/components/schemas/HealthMetricDto'
        groceryLists:
          type: array
          items:
            $ref: '#/components/schemas/GroceryListDto'
        dailyLogs:
          type: array
          items:
            $ref: '#/components/schemas/DailyLogDto'
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseDto'
        workoutSessions:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutSessionDto'
        dayPlans:
          type: array
          items:
            $ref: '#/components/schemas/DayPlanDto'
        loggedMealSlots:
          type: array
          items:
            $ref: '#/components/schemas/LoggedMealSlotDto'
      required: [accepted]

    SyncPullResponse:
      type: object
      description: |
        Delta payload — only records with `updatedAt > since` are included per domain.
        `loggedMealSlots` contains all slots with `date >= date(since)`.
        Store `serverTime` and pass it as `since` on the next pull to avoid gaps.
      properties:
        foods:
          type: array
          items:
            $ref: '#/components/schemas/FoodDto'
        meals:
          type: array
          items:
            $ref: '#/components/schemas/MealDto'
        diets:
          type: array
          items:
            $ref: '#/components/schemas/DietDto'
        healthMetrics:
          type: array
          items:
            $ref: '#/components/schemas/HealthMetricDto'
        groceryLists:
          type: array
          items:
            $ref: '#/components/schemas/GroceryListDto'
        dailyLogs:
          type: array
          items:
            $ref: '#/components/schemas/DailyLogDto'
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseDto'
        workoutSessions:
          type: array
          items:
            $ref: '#/components/schemas/WorkoutSessionDto'
        dayPlans:
          type: array
          items:
            $ref: '#/components/schemas/DayPlanDto'
        loggedMealSlots:
          type: array
          items:
            $ref: '#/components/schemas/LoggedMealSlotDto'
        tombstones:
          type: array
          items:
            $ref: '#/components/schemas/TombstoneDto'
        serverTime:
          type: string
          format: date-time
          description: Server clock at response time — use as `since` on next pull
      required: [foods, meals, diets, healthMetrics, groceryLists, dailyLogs, exercises, workoutSessions, dayPlans, loggedMealSlots, tombstones, serverTime]

    PushSubscriptionRequest:
      type: object
      description: A browser Web Push subscription (as returned by `PushManager.subscribe`).
      properties:
        endpoint:
          type: string
          description: Push service endpoint URL — unique per browser subscription
        keys:
          $ref: '#/components/schemas/PushSubscriptionKeys'
        userAgent:
          type: string
          nullable: true
          description: Optional UA string, to help the user recognise the device
      required: [endpoint, keys]

    PushSubscriptionKeys:
      type: object
      description: Encryption keys from the browser subscription.
      properties:
        p256dh:
          type: string
        auth:
          type: string
      required: [p256dh, auth]

    PushUnsubscribeRequest:
      type: object
      properties:
        endpoint:
          type: string
      required: [endpoint]

    ReminderRunResponse:
      type: object
      description: Result of a scheduler-triggered reminder run.
      properties:
        checked:
          type: integer
          description: Subscriptions evaluated
        sent:
          type: integer
          description: Reminders sent
        pruned:
          type: integer
          description: Stale subscriptions removed (push service returned 404/410)
      required: [checked, sent, pruned]
