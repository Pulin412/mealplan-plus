openapi: 3.0.3
info:
  title: MealPlan+ API
  description: |
    REST API for MealPlan+ — nutrition tracking, meal planning & fitness.

    ## Authentication
    All endpoints require a Firebase ID token in the `Authorization: Bearer <token>` header.
    The backend resolves the token to a `firebaseUid` and auto-creates the user on first call.

    ## Sync strategy
    Client-server sync uses **last-write-wins on `updatedAt`**.
    - Every syncable resource carries `serverId` (stable UUID, survives local DB wipes) and `updatedAt`.
    - **Pull:** `GET /api/v1/sync/pull?since=<ISO-8601>` — returns all records changed after `since`.
    - **Push:** `POST /api/v1/sync/push` — upserts records by `serverId`; server returns count accepted.
    - Android `SyncWorker` stores `serverTime` from the previous pull response and passes it as `since`.
    - Soft-deleted records are communicated via `tombstones[]` in the pull response.

    ## Macros
    All food macros are stored and returned **per 100 g**. Clients compute per-serving values
    using `gramsPerPiece` / `gramsPerCup` / `gramsPerTbsp` / `gramsPerTsp` as needed.
  version: v1

servers:
  - url: https://mealplan-api-rfo22lhanq-ez.a.run.app
    description: Production (Cloud Run)
  - url: http://localhost:8080
    description: Local dev

security:
  - FirebaseJWT: []

tags:
  - name: Users
    description: Identity & profile — auto-created on first authenticated call
  - name: Dashboard
    description: Today-at-a-glance — calorie ring, slot checklist, streak, macros
  - name: Foods
    description: Food items with per-100g nutritional data (system-wide + user-created)
  - name: Meals
    description: Named collections of foods
  - name: Diets
    description: Day-plan templates composed of meals and direct food entries
  - name: Tags
    description: Universal tags shared across Diets, Exercises, Meals and Foods
  - name: Exercises
    description: Exercise library (system + user-created)
  - name: Workout Templates
    description: Reusable workout plans (ordered exercises with target sets × reps)
  - name: Workout Sessions
    description: Completed workout logs with per-set actuals
  - name: Plans
    description: Calendar day-plans linking a diet and planned workouts to a date
  - name: Logging
    description: Real-time meal-slot toggle logging and individual food additions
  - name: Health Metrics
    description: Weight, glucose, blood pressure, steps and custom metrics
  - name: Daily Logs
    description: Legacy per-day food consumption records (used by sync)
  - name: Grocery Lists
    description: Shopping lists, optionally linked to a diet
  - name: Sync
    description: Delta sync — push local changes, pull server changes since a timestamp
  - name: Feedback
    description: In-app user feedback submissions
  - name: Social
    description: >-
      Follow graph, public profiles, discovery, and safety (block/report).
      An online-only read layer over the offline-first personal data — others'
      data is fetched live and never written into the sync tables. See issue #175.
  - name: Assistant
    description: >-
      Backend-mediated AI nutrition assistant — chat over the user's own data (grounded in
      in-process tools) plus read-only status of the provider failover chain.

# ─────────────────────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────────────────────
paths:

  # ── Users ──────────────────────────────────────────────────────────────────
  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get current user
      description: Returns the authenticated user profile. Auto-creates the user on first call.
      operationId: getMe
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Users]
      summary: Update user profile
      description: Updates body metrics, goals, macro targets and unit preference.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Users]
      summary: Delete account (right to erasure)
      description: >-
        Permanently deletes the authenticated user and ALL their data (meals, diets, foods,
        health metrics, workouts, plans, logs, grocery lists, etc.). Irreversible. The caller
        should also delete its own Firebase auth account and sign out after a 204.
      operationId: deleteMe
      responses:
        '204':
          description: Account and all associated data deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Dashboard ───────────────────────────────────────────────────────────────
  /api/v1/dashboard:
    get:
      tags: [Dashboard]
      summary: Get today's dashboard
      description: |
        Returns the full Home / Today payload for the authenticated user.
        Includes the calorie ring, macro panel, planned meal slots with logging state,
        individually-added foods, streak, Health Connect totals, and diet count.
      operationId: getDashboard
      parameters:
        - name: date
          in: query
          required: false
          description: Override "today" (YYYY-MM-DD). Defaults to the server's UTC date.
          schema:
            type: string
            format: date
            example: "2026-07-18"
      responses:
        '200':
          description: Dashboard payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Foods ───────────────────────────────────────────────────────────────────
  /api/v1/foods:
    get:
      tags: [Foods]
      summary: List foods
      description: Returns all system foods plus foods created by the authenticated user.
      operationId: listFoods
      parameters:
        - name: favorites
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: When true, returns only items where `isFavorite = true`.
      responses:
        '200':
          description: List of foods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Foods]
      summary: Create food
      operationId: createFood
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodDto'
      responses:
        '201':
          description: Created food
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/foods/search:
    get:
      tags: [Foods]
      summary: Search foods
      description: Full-text search across system and user foods by name or brand. Returns a paginated result.
      operationId: searchFoods
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            default: ""
          description: Search query (name or brand)
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 30
            maximum: 100
      responses:
        '200':
          description: Paginated food results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/foods/search-online:
    get:
      tags: [Foods]
      summary: Search Open Food Facts (server-side proxy)
      description: |
        Proxied text search against Open Food Facts. Done server-side so browser clients avoid CORS
        (the reliable OFF search host sends no CORS header). Returns lightweight FoodDto results with
        no `id` — the client creates the chosen one via `POST /foods`. Android calls Open Food Facts
        directly and does not use this endpoint.
      operationId: searchFoodsOnline
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query (product name or brand)
      responses:
        '200':
          description: Matching products from Open Food Facts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FoodDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/foods/{id}:
    get:
      tags: [Foods]
      summary: Get food by ID
      operationId: getFood
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Food
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Foods]
      summary: Update food
      description: Full replace of a user-owned food. System foods cannot be updated.
      operationId: updateFood
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FoodDto'
      responses:
        '200':
          description: Updated food
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Foods]
      summary: Delete food
      operationId: deleteFood
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/foods/{id}/favorite:
    patch:
      tags: [Foods]
      summary: Toggle favourite
      description: |
        Toggles `isFavorite` for the food. For system foods, the preference is stored
        per-user in `food_user_prefs`; for user-owned foods it updates `foods.is_favorite`.
      operationId: toggleFoodFavorite
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Food with updated `isFavorite`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Meals ───────────────────────────────────────────────────────────────────
  /api/v1/meals:
    get:
      tags: [Meals]
      summary: List meals
      operationId: listMeals
      parameters:
        - name: favorites
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of meals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MealDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Meals]
      summary: Create meal
      operationId: createMeal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealDto'
      responses:
        '201':
          description: Created meal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/meals/{id}:
    get:
      tags: [Meals]
      summary: Get meal by ID
      operationId: getMeal
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Meal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Meals]
      summary: Update meal
      operationId: updateMeal
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealDto'
      responses:
        '200':
          description: Updated meal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Meals]
      summary: Delete meal
      operationId: deleteMeal
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/meals/{id}/favorite:
    patch:
      tags: [Meals]
      summary: Toggle favourite
      operationId: toggleMealFavorite
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Meal with updated `isFavorite`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/meals/{serverId}/share:
    patch:
      tags: [Meals]
      summary: Toggle whether this meal is shared with followers
      description: Keyed by the stable serverId so any client can call it without the numeric id.
      operationId: toggleMealShare
      parameters:
        - $ref: '#/components/parameters/ServerIdPath'
      responses:
        '200':
          description: Meal with updated `isShared`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Diets ───────────────────────────────────────────────────────────────────
  /api/v1/diets:
    get:
      tags: [Diets]
      summary: List diets
      operationId: listDiets
      parameters:
        - name: favorites
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: List of diets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DietDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Diets]
      summary: Create diet
      operationId: createDiet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DietDto'
      responses:
        '201':
          description: Created diet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/diets/{id}:
    get:
      tags: [Diets]
      summary: Get diet by ID
      operationId: getDiet
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Diet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Diets]
      summary: Update diet
      operationId: updateDiet
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DietDto'
      responses:
        '200':
          description: Updated diet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Diets]
      summary: Delete diet
      operationId: deleteDiet
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/diets/{id}/duplicate:
    post:
      tags: [Diets]
      summary: Duplicate diet
      description: Creates a full copy of the diet (name appended with " (copy)") for the authenticated user.
      operationId: duplicateDiet
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '201':
          description: New duplicate diet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/diets/{id}/favorite:
    patch:
      tags: [Diets]
      summary: Toggle favourite
      operationId: toggleDietFavorite
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Diet with updated `isFavorite`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/diets/{serverId}/share:
    patch:
      tags: [Diets]
      summary: Toggle whether this diet is shared with followers
      description: Keyed by the stable serverId so any client can call it without the numeric id.
      operationId: toggleDietShare
      parameters:
        - $ref: '#/components/parameters/ServerIdPath'
      responses:
        '200':
          description: Diet with updated `isShared`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DietDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/workout-templates/{serverId}/share:
    patch:
      tags: [Workout Templates]
      summary: Toggle whether this workout template is shared with followers
      description: Keyed by the stable serverId so any client can call it without the numeric id.
      operationId: toggleWorkoutTemplateShare
      parameters:
        - $ref: '#/components/parameters/ServerIdPath'
      responses:
        '200':
          description: Template with updated `isShared`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutTemplateDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Tags ────────────────────────────────────────────────────────────────────
  /api/v1/tags:
    get:
      tags: [Tags]
      summary: List tags
      description: |
        Returns system tags (firebaseUid = null) plus user-created tags.
        Filter by `entityType` to get tags relevant to a specific domain.
      operationId: listTags
      parameters:
        - name: entityType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TagEntityType'
          description: Filter to a specific entity type. Omit to get all tags.
      responses:
        '200':
          description: List of tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TagDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Tags]
      summary: Create tag
      operationId: createTag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Created tag (or existing tag if name already exists for this user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/tags/{id}:
    delete:
      tags: [Tags]
      summary: Delete tag
      description: Deletes the tag and removes all entity_tags associations.
      operationId: deleteTag
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Exercises ───────────────────────────────────────────────────────────────
  /api/v1/exercises:
    get:
      tags: [Exercises]
      summary: List exercises
      description: Returns system exercises plus user-created exercises. Optionally filter by name or tag.
      operationId: listExercises
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive name search (pushed to SQL ILIKE).
        - name: tagId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Filter to exercises tagged with this tag ID.
      responses:
        '200':
          description: List of exercises
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Exercises]
      summary: Create exercise
      operationId: createExercise
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseDto'
      responses:
        '201':
          description: Created exercise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/exercises/{id}:
    get:
      tags: [Exercises]
      summary: Get exercise by ID
      operationId: getExercise
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Exercise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Exercises]
      summary: Update exercise
      operationId: updateExercise
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseDto'
      responses:
        '200':
          description: Updated exercise
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Exercises]
      summary: Delete exercise
      description: Deletes exercise and cascades tag associations. Removing from workout templates is not automatic — clients must handle orphan cleanup.
      operationId: deleteExercise
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── Workout Templates ────────────────────────────────────────────────────────
  /api/v1/workout-templates:
    get:
      tags: [Workout Templates]
      summary: List workout templates
      operationId: listWorkoutTemplates
      parameters:
        - name: tagId
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Filter to templates tagged with this tag ID.
      responses:
        '200':
          description: List of workout templates
          content:
            application/json:
